camera_source: http://192.168.2.193:8080/video
camera:
  reconnect_interval_sec: 5
  max_reconnect_attempts: 10
  queue_size: 5
  frame_timeout_sec: 2.0
yolo_weights: models/detection/best.pt
number_weights: models/detection/number_best.pt
crnn_weights: models/recognition/crnn_finetuned.pth
charset_path: models/recognition/charset.txt
db_path: plates.db
assume_crop: false
mqtt:
  enabled: false
  broker_host: localhost
  broker_port: 1883
  gate_id: main_gate
  open_duration_sec: 3
gate:
  yolo_confidence_threshold: 0.5
  number_confidence_threshold: 0.4
  crnn_confidence_threshold: 0.7
  constrained_matching: true
  match_max_distance: 1
  format_validation: true
  confidence_mode: mean
  orientation_search: false
  consistency_check: false
  province_confidence_min: 0.55
  number_alignment_min: 0.2
  parking_mode: false
  parking_camera_role: auto
  parking_exit_fuzzy: true
  parking_stale_hours: 12
  parking_require_permit: false
  location: Main Gate
display:
  show_fps: true
  show_latency: true
  show_plate_text: true
  font_scale: 0.7
output:
  save_annotated: true
  save_crops: false
  output_dir: outputs/
  photo_dir: photos/
detection:
  crop_padding: 0.0
logging:
  level: INFO
  log_dir: logs/
  dedup_enabled: true
  dedup_gap_sec: 3.0
  dedup_merge_edits: 2
health:
  metrics_every_frames: 100
  latency_alert_ms: 500
  disconnect_alert_sec: 15
gdrive:
  enabled: true
  credentials_path: configs/gdrive_credentials.json
  token_path: configs/gdrive_token.json
  sync_state_path: configs/gdrive_sync_state.json
  root_folder_name: Cambodian ALPR Project
  auto_upload:
    photos: true
    outputs: true
    logs: true
    db_backup: true
    db_backup_interval_hours: 6
  sync:
    models: bidirectional
    data: upload_only
    runs: upload_only
    results: upload_only
  cleanup:
    delete_local_after_upload: false
    keep_local_days: 30
